services:
  - type: web
    name: gurunanak-cloth-house
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: "Guru Nanak Cloth House"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:mYkcUuoWpp3QJ+TjCo/mBjTTuSpqiyudrKaJGe8Wrpo="
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: PORT
        value: "10000"
